<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arnegards Arenapoint Calculator</title>
  <style>
    :root{
      --bg:#ffffff;
      --text:#111111;
      --card:#ffffff;
      --border:#dddddd;
      --muted:#555555;
      --input-bg:#ffffff;
      --out-bg:#f6f6f6;
      --code-bg:#f0f0f0;
      --btn-bg:#ffffff;
      --btn-text:#111111;
    }

    body.dark{
      --bg:#0b0f14;
      --text:#e8eef6;
      --card:#111827;
      --border:#263244;
      --muted:#a7b4c6;
      --input-bg:#0f172a;
      --out-bg:#0f172a;
      --code-bg:#0b1220;
      --btn-bg:#0f172a;
      --btn-text:#e8eef6;
    }

    body {
      font-family: system-ui, Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
      background: var(--bg);
      color: var(--text);
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 14px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      background: var(--card);
    }

    label { display: block; margin-bottom: 6px; font-weight: 600; }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
    }

    button {
      margin-top: 12px;
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      cursor: pointer;
      background: var(--btn-bg);
      color: var(--btn-text);
    }

    button:hover { filter: brightness(1.05); }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .out {
      margin-top: 12px;
      padding: 12px;
      background: var(--out-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .small { color: var(--muted); font-size: 14px; margin-top: 8px; }

    code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .toggle {
      display:flex;
      align-items:center;
      gap:10px;
      user-select:none;
      font-size:14px;
      color: var(--muted);
    }

    .toggle input { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1 style="margin:0;">Arnegards Arenapoint Calculator</h1>

    <label class="toggle" title="Toggle dark mode">
      <input id="darkToggle" type="checkbox" />
      Dark mode
    </label>
  </div>

  <div class="card">
    <label for="rInput">Enter raiting</label>
    <input id="rInput" type="text" inputmode="decimal" placeholder="e.g. 1200 or 1200,5" />

    <div class="row">
      <button id="calcBtn">Calculate</button>
      <button id="clearBtn" type="button">Clear</button>
    </div>

    <div class="out" id="output">p = —</div>
    <div class="small">
      Formula:
      <code>p = ((1651.94 - 475) / (1 + 2500000 * e^(-0.009*r)) + 475) * 1.5</code>
    </div>
  </div>

  <script>
    function calculateP(r) {
      return ((1651.94 - 475) / (1 + 2500000 * Math.exp(-0.009 * r)) + 475) * 1.5;
    }

    const rInput = document.getElementById("rInput");
    const output = document.getElementById("output");
    const calcBtn = document.getElementById("calcBtn");
    const clearBtn = document.getElementById("clearBtn");
    const darkToggle = document.getElementById("darkToggle");

    function parseNumber(text) {
      const normalized = text.trim().replace(",", ".");
      const value = Number(normalized);
      return Number.isFinite(value) ? value : null;
    }

    function doCalc() {
      const r = parseNumber(rInput.value);
      if (r === null) {
        output.textContent = "p = Invalid number. Please enter a valid r.";
        return;
      }
      const p = calculateP(r);
      output.textContent = `p = ${p.toFixed(4)}`;
    }

    // Dark mode: remember preference
    function setDarkMode(on) {
      document.body.classList.toggle("dark", on);
      localStorage.setItem("darkMode", on ? "1" : "0");
      darkToggle.checked = on;
    }

    const saved = localStorage.getItem("darkMode");
    if (saved === null) {
      // Default: follow system preference if no saved setting
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      setDarkMode(prefersDark);
    } else {
      setDarkMode(saved === "1");
    }

    darkToggle.addEventListener("change", () => setDarkMode(darkToggle.checked));

    calcBtn.addEventListener("click", doCalc);

    clearBtn.addEventListener("click", () => {
      rInput.value = "";
      output.textContent = "p = —";
      rInput.focus();
    });

    rInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doCalc();
    });
  </script>
</body>
</html>
